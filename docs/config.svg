  <text x="128" y="694" font-size="12" fill="#475569">Base, z = 0</text>
  <line x1="50" y1="776" x2="284" y2="776" stroke="#64748b" stroke-width="2"/>
  <text x="54" y="792" font-size="11" fill="#64748b">Mesa</text>
