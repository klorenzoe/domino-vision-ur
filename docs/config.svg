  </defs>
  <rect width="1200" height="830" fill="#f8fafc"/>

  <text x="40" y="48" font-size="26" font-weight="bold" fill="#0f172a">Medidas del laboratorio · src/config.py</text>
  <text x="40" y="74" font-size="14" fill="#64748b">Vista superior de la mesa en mm. Cada color corresponde a una constante del config.</text>
  <rect x="40" y="88" width="452" height="28" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="56" y="107" font-size="13" font-weight="bold" fill="#92400e">Valores de ejemplo y aproximados: confirmar en el laboratorio</text>

  <rect x="30" y="134" width="560" height="482" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <circle cx="125" cy="155" r="16" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="148" y="160" font-size="12" fill="#475569">Base del robot</text>

  <rect x="80" y="190" width="448" height="350" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="76" y="184" font-size="11" fill="#64748b" text-anchor="end">(0, 0)</text>

  <rect x="150" y="190" width="308" height="140" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
