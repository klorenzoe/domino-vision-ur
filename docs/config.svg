  <line x1="80" y1="596" x2="528" y2="596" stroke="#2563eb" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <rect x="270" y="586" width="68" height="20" fill="#ffffff"/>
  <text x="304" y="601" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">640 mm</text>
  <line x1="562" y1="190" x2="562" y2="540" stroke="#2563eb" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <rect x="546" y="345" width="32" height="40" fill="#ffffff"/>
  <text x="562" y="362" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">500</text>
  <text x="562" y="378" font-size="12" fill="#2563eb" text-anchor="middle">mm</text>

  <rect x="30" y="632" width="272" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
