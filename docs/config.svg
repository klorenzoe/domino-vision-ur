      <text x="22" y="26" font-size="15" font-weight="bold" fill="#1e40af">TABLE_SIZE_MM</text>
      <text x="22" y="48" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0f172a">(640.0, 500.0)</text>
      <text x="22" y="64" fill="#64748b">Ancho y fondo de la mesa. Medir con cinta.</text>
      <rect x="472" y="12" width="64" height="20" rx="10" fill="#fef3c7"/><text x="504" y="26" text-anchor="middle" fill="#92400e">aprox.</text>
    </g>
    <g transform="translate(620,214)">
      <rect width="550" height="72" rx="12" fill="#ffffff" stroke="#e2e8f0"/><rect width="6" height="72" rx="3" fill="#dc2626"/>
      <text x="22" y="26" font-size="15" font-weight="bold" fill="#b91c1c">ARUCO_TABLE_MM</text>
      <text x="22" y="48" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">{0: (40, 40), 1: (600, 40), 2: (40, 460), 3: (600, 460)}</text>
      <text x="22" y="64" fill="#64748b">Centro de cada ArUco en la mesa. Verificar con regla.</text>
      <rect x="452" y="12" width="84" height="20" rx="10" fill="#fef3c7"/><text x="494" y="26" text-anchor="middle" fill="#92400e">por diseño</text>
    </g>
