      <text x="22" y="26" font-size="15" font-weight="bold" fill="#c2410c">ARUCO_ROBOT_MM</text>
      <text x="22" y="48" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">{0: (100, -20, -64), 1: (100, 540, -64), 2: (520, -20, -64)}</text>
      <text x="22" y="64" fill="#64748b">Mismos centros en el marco del robot (freedrive). Pendant: x, y con signo invertido.</text>
      <rect x="464" y="12" width="72" height="20" rx="10" fill="#fef3c7"/><text x="500" y="26" text-anchor="middle" fill="#92400e">ejemplo</text>
    </g>
    <g transform="translate(620,374)">
      <rect width="550" height="72" rx="12" fill="#ffffff" stroke="#e2e8f0"/><rect width="6" height="72" rx="3" fill="#d97706"/>
      <text x="22" y="26" font-size="15" font-weight="bold" fill="#b45309">TILE_Z_MM</text>
      <text x="22" y="48" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0f172a">-60.0</text>
      <text x="22" y="64" fill="#64748b">Altura de agarre en el robot: z de la mesa + grosor de la ficha / 2.</text>
      <rect x="472" y="12" width="64" height="20" rx="10" fill="#fef3c7"/><text x="504" y="26" text-anchor="middle" fill="#92400e">aprox.</text>
    </g>
    <g transform="translate(620,454)">
      <rect width="550" height="72" rx="12" fill="#ffffff" stroke="#e2e8f0"/><rect width="6" height="72" rx="3" fill="#0d9488"/>
      <text x="22" y="26" font-size="15" font-weight="bold" fill="#0f766e">POOL_ZONE_MM</text>
      <text x="22" y="48" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0f172a">(100.0, 0.0, 540.0, 200.0)</text>
      <text x="22" y="64" fill="#64748b">(x_min, y_min, x_max, y_max). Recortar si el robot no llega.</text>
      <rect x="472" y="12" width="64" height="20" rx="10" fill="#fef3c7"/><text x="504" y="26" text-anchor="middle" fill="#92400e">aprox.</text>
    </g>
    <g transform="translate(620,534)">
      <rect width="550" height="72" rx="12" fill="#ffffff" stroke="#e2e8f0"/><rect width="6" height="72" rx="3" fill="#7c3aed"/>
      <text x="22" y="26" font-size="15" font-weight="bold" fill="#5b21b6">GAME_ZONE_MM</text>
      <text x="22" y="48" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0f172a">(0.0, 210.0, 640.0, 420.0)</text>
      <text x="22" y="64" fill="#64748b">(x_min, y_min, x_max, y_max). El robot debe llegar a los dos extremos.</text>
      <rect x="472" y="12" width="64" height="20" rx="10" fill="#fef3c7"/><text x="504" y="26" text-anchor="middle" fill="#92400e">aprox.</text>
    </g>
    <g transform="translate(620,614)">
      <rect width="550" height="72" rx="12" fill="#ffffff" stroke="#e2e8f0"/><rect width="6" height="72" rx="3" fill="#16a34a"/>
      <text x="22" y="26" font-size="15" font-weight="bold" fill="#15803d">WARP_PX_PER_MM</text>
      <text x="22" y="48" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0f172a">2.0</text>
      <text x="22" y="64" fill="#64748b">Resolución de la imagen cenital: lado en px del ArUco del fondo / 80.</text>
      <rect x="472" y="12" width="64" height="20" rx="10" fill="#fef3c7"/><text x="504" y="26" text-anchor="middle" fill="#92400e">revisar</text>
    </g>
    <g transform="translate(620,694)">
      <rect width="550" height="106" rx="12" fill="#ffffff" stroke="#e2e8f0"/><rect width="6" height="106" rx="3" fill="#6b7280"/>
      <text x="22" y="26" font-size="15" font-weight="bold" fill="#374151">Fijos (no se miden)</text>
      <text x="22" y="50" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">ARUCO_DICT = "DICT_4X4_50"</text>
      <text x="22" y="70" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">ARUCO_SIZE_MM = 80.0</text>
      <text x="22" y="90" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">MIN_ARUCO_VISIBLE = 4</text>
      <text x="300" y="50" fill="#64748b">Diccionario de la hoja impresa</text>
      <text x="300" y="70" fill="#64748b">Lado del ArUco (no se usa para H)</text>
      <text x="300" y="90" fill="#64748b">H se calcula con los 4 centros</text>
    </g>
  </g>

  <text x="40" y="820" font-size="12" fill="#94a3b8">Origen (0, 0): esquina de la mesa del lado del robot · x hacia la derecha · y alejándose del robot</text>
