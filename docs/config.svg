  <text x="414" y="706" font-size="20" font-weight="bold" fill="#16a34a">1 mm = 2 px</text>
  <text x="414" y="730" font-size="12" fill="#475569">ArUco: 80 mm → 160 px</text>
  <text x="414" y="748" font-size="12" fill="#475569">Mesa → 1280 × 1000 px</text>

  <g font-size="12">
    <g transform="translate(620,134)">
