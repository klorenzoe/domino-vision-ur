  <line x1="116" y1="712" x2="186" y2="712" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <line x1="186" y1="712" x2="186" y2="766" stroke="#d97706" stroke-width="2" marker-end="url(#aa)"/>
  <line x1="186" y1="770" x2="210" y2="770" stroke="#d97706" stroke-dasharray="3 3"/>
  <text x="196" y="744" font-size="13" font-weight="bold" fill="#d97706">≈ −60 mm</text>

  <rect x="318" y="632" width="272" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="336" y="658" font-size="13" font-weight="bold" fill="#0f172a">Imagen rectificada</text>
